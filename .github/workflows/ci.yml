name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-build:
    name: "Backend (PSU Proxy + PSU Script Runner) Build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: psu-be
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Check license headers
        run: ./mvnw -B validate
      - name: Build and test
        run: ./mvnw -B verify

  frontend-build:
    name: "Frontend (GUI) Build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: psu-fe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: psu-fe/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check licenses
        run: |
          npm run license:check
          npm run license:policy
      - name: Run tests
        run: npm run test
      - name: Build
        run: npm run build

  installer-test:
    name: "Installer (Go) Test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: psu-install
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Run tests
        run: go test ./...
