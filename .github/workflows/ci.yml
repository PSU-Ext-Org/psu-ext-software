name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-build:
    name: "Backend (PSU Proxy + PSU Script Runner) Build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: psu-be
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Check license headers
        run: ./mvnw -B validate
      - name: Build and test
        run: ./mvnw -B verify

  frontend-build:
    name: "Frontend (GUI) Build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: psu-fe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: psu-fe/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check licenses
        run: |
          npm run license:check
          npm run license:policy
      - name: Run tests
        run: npm run test
      - name: Build
        run: npm run build

  installer-platforms:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.platforms.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Test platform descriptors and release metadata
        run: python3 -m unittest discover -s psu-install/scripts -p "test_*.py"
      - name: Discover installer platforms
        id: platforms
        run: python3 psu-install/scripts/platform-matrix.py psu-install/platforms >> "$GITHUB_OUTPUT"

  installer-test:
    name: "Installer (${{ matrix.platform }}) Test"
    needs: installer-platforms
    strategy:
      matrix: ${{ fromJSON(needs.installer-platforms.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Check formatting
        if: runner.os == 'Linux'
        working-directory: psu-install
        run: test -z "$(gofmt -l .)"
      - name: Check bootstrap scripts
        run: ${{ matrix.checkBootstrap }}
      - name: Run tests
        working-directory: psu-install
        run: go test ./...
